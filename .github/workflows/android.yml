name: Monster Merge Android APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install and configure Godot Android export requirements
        shell: bash
        run: |
          set -euo pipefail

          GODOT_VERSION="4.4.1"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR" "$HOME/.config/godot" "$HOME/.local/share/godot"

          if [ ! -s "$TEMPLATE_DIR/android_debug.apk" ] || [ ! -s "$TEMPLATE_DIR/android_release.apk" ]; then
            curl -fL --retry 3               "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"               -o /tmp/godot-templates.tpz
            mkdir -p /tmp/godot-templates
            unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
            cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          fi

          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          ANDROID_SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          test -x "$JAVA_HOME/bin/java"
          test -d "$ANDROID_SDK_PATH/platform-tools"

          keytool -genkeypair -noprompt -keyalg RSA -keysize 2048 -validity 10000             -alias androiddebugkey             -keystore "$HOME/debug.keystore"             -storepass android -keypass android             -dname "CN=Android Debug,O=Android,C=US"

          SETTINGS="$HOME/.config/godot/editor_settings-4.4.tres"
          cat > "$SETTINGS" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_SDK_PATH"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/timestamping_authority_url = ""
          export/android/shutdown_adb_on_exit = true
          EOF

          echo "Godot templates:"
          ls -lh "$TEMPLATE_DIR"/android_*.apk
          echo "Java SDK: $JAVA_HOME"
          echo "Android SDK: $ANDROID_SDK_PATH"

      - name: Verify project files
        run: |
          test -f project.godot
          test -f scenes/Main.tscn
          test -f scripts/game_manager.gd
          mkdir -p build

      - name: Import project and validate scripts
        run: |
          godot --headless --editor --path . --import
          godot --headless --path . --quit

      - name: Export Android APK
        run: |
          godot --headless --path . --export-debug "Android" build/MonsterMerge.apk
          test -s build/MonsterMerge.apk
          ls -lh build/MonsterMerge.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monster-Merge-Android-APK
          path: build/MonsterMerge.apk
          if-no-files-found: error
          retention-days: 14
