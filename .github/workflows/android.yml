name: Monster Merge Android APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          test -f project.godot
          test -f scenes/Main.tscn
          test -f scripts/game_manager.gd
          mkdir -p build

      - name: Import project and validate scripts
        run: |
          godot --headless --editor --path . --import
          godot --headless --path . --quit

      - name: Export Android APK
        run: |
          godot --headless --path . --export-debug "Android" build/MonsterMerge.apk
          test -s build/MonsterMerge.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monster-Merge-Android-APK
          path: build/MonsterMerge.apk
          if-no-files-found: error
          retention-days: 14
