name: Monster Merge Android APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install and configure Godot Android export requirements
        shell: bash
        run: |
          set -euo pipefail

          # The upstream image omits curl and Python; install the small tools
          # needed to fetch and unpack the official Godot export templates.
          apt-get update
          apt-get install -y --no-install-recommends curl unzip ca-certificates
          rm -rf /var/lib/apt/lists/*

          GODOT_VERSION="4.4.1"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR" "$HOME/.config/godot" "$HOME/.local/share/godot"

          if [ ! -s "$TEMPLATE_DIR/android_debug.apk" ] || [ ! -s "$TEMPLATE_DIR/android_release.apk" ]; then
            curl --fail --location --retry 3 --output /tmp/godot-templates.tpz \
              "https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz"
            mkdir -p /tmp/godot-templates
            unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
            cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          fi

          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          ANDROID_SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          export JAVA_HOME ANDROID_HOME="$ANDROID_SDK_PATH" ANDROID_SDK_ROOT="$ANDROID_SDK_PATH"
          test -x "$JAVA_HOME/bin/java"
          mkdir -p "$ANDROID_SDK_PATH"
          SDKMANAGER="$(find "$ANDROID_SDK_PATH/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_PATH" --licenses >/dev/null || true
            "$SDKMANAGER" --sdk_root="$ANDROID_SDK_PATH" "platforms;android-35" "build-tools;35.0.0" "build-tools;33.0.2" "platform-tools"
          else
            echo "Android sdkmanager not found under $ANDROID_SDK_PATH"
            exit 1
          fi
          test -d "$ANDROID_SDK_PATH/platforms/android-35"
          test -d "$ANDROID_SDK_PATH/build-tools/35.0.0"
          test -d "$ANDROID_SDK_PATH/build-tools/33.0.2"
          test -x "$ANDROID_SDK_PATH/build-tools/35.0.0/aapt"
          echo "Installed Android platforms:"; ls -1 "$ANDROID_SDK_PATH/platforms"
          echo "Installed Android build-tools:"; ls -1 "$ANDROID_SDK_PATH/build-tools"

          keytool -genkeypair -noprompt -keyalg RSA -keysize 2048 -validity 10000 \
            -alias androiddebugkey -keystore "$HOME/debug.keystore" \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

          SETTINGS="$HOME/.config/godot/editor_settings-4.4.tres"
          cat > "$SETTINGS" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_SDK_PATH"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/timestamping_authority_url = ""
          export/android/shutdown_adb_on_exit = true
          EOF

          echo "Godot templates:"
          ls -lh "$TEMPLATE_DIR"/android_*.apk
          echo "Java SDK: $JAVA_HOME"
          echo "Android SDK: $ANDROID_SDK_PATH"

      - name: Verify project files
        run: |
          test -f project.godot
          test -f scenes/Main.tscn
          test -f scripts/game_manager.gd
          mkdir -p build

      - name: Import project and validate scripts
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --import 2>&1 | tee build/import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" build/import.log; then
            echo "Godot reported script/import errors."
            exit 1
          fi
          godot --headless --path . --quit 2>&1 | tee build/validation.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" build/validation.log; then
            echo "Godot reported runtime validation errors."
            exit 1
          fi

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail
          # Pass all three debug-signing values explicitly; Godot requires them as a complete set.
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          godot --headless --verbose --path . --export-debug "Android" build/MonsterMerge.apk 2>&1 | tee build/export.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" build/export.log; then
            echo "Godot reported export errors."
            exit 1
          fi
          test -s build/MonsterMerge.apk
          ls -lh build/MonsterMerge.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monster-Merge-Android-APK
          path: build/MonsterMerge.apk
          if-no-files-found: error
          retention-days: 14
