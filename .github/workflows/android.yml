name: Monster Merge Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Godot and Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          include-templates: true
          use-dotnet: false

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          JAVA_HOME_REAL="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo '[resource]'
            printf 'export/android/android_sdk_path = "%s"\n' "$ANDROID_HOME"
            printf 'export/android/java_sdk_path = "%s"\n' "$JAVA_HOME_REAL"
          } > "$HOME/.config/godot/editor_settings-4.4.tres"

          keytool -genkeypair -noprompt -keyalg RSA -keysize 2048 -validity 10000 \
            -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "Java:"
          java -version
          echo "Android SDK: $ANDROID_HOME"
          ls -ld "$ANDROID_HOME/platforms/android-35" "$ANDROID_HOME/build-tools/35.0.0"
          echo "Godot templates:"
          ls -lh "$HOME/.local/share/godot/export_templates/4.4.1.stable"/android_*.apk

      - name: Verify project files
        run: |
          test -f project.godot
          test -f scenes/Main.tscn
          test -f scripts/game_manager.gd
          mkdir -p build

      - name: Install Android Gradle build template
        shell: bash
        run: |
          set -euo pipefail
          TEMPLATES="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          ls -lh "$TEMPLATES" | grep -i android || true
          test -f "$TEMPLATES/android_source.zip"
          mkdir -p android/build
          unzip -q -o "$TEMPLATES/android_source.zip" -d android/build
          echo "4.4.1.stable" > android/.build_version
          touch android/build/.gdignore
          ls android/build | head -20

      - name: Import project and validate scripts
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --import 2>&1 | tee build/import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error" build/import.log; then
            echo "Godot reported script/import errors."
            exit 1
          fi
          godot --headless --path . --quit 2>&1 | tee build/validation.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error" build/validation.log; then
            echo "Godot reported runtime validation errors."
            exit 1
          fi

      - name: Diagnostics (what Godot checks before exporting)
        shell: bash
        run: |
          echo "== templates =="; ls -la "$HOME/.local/share/godot/export_templates/4.4.1.stable" | head -40
          echo "== SDK =="; echo "$ANDROID_HOME"; ls "$ANDROID_HOME"
          echo "-- platform-tools"; ls "$ANDROID_HOME/platform-tools" | head -5
          echo "-- cmdline-tools"; ls "$ANDROID_HOME/cmdline-tools" || echo MISSING
          echo "-- build-tools"; ls "$ANDROID_HOME/build-tools" || echo MISSING
          echo "-- platforms"; ls "$ANDROID_HOME/platforms" || echo MISSING
          echo "== editor settings =="; cat "$HOME/.config/godot/editor_settings-4.4.tres"
          echo "== keystore =="; ls -la "$HOME/.android"
          echo "== gradle template =="; cat android/.build_version || echo NO_VERSION_FILE; ls android/build | head -20
          echo "== presets (no secrets) =="; grep -v -i password export_presets.cfg

      - name: Export native Android APK
        shell: bash
        run: |
          set -euo pipefail
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore" \
          GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey" \
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android" \
            godot --verbose --headless --path . --export-debug "Android" build/MonsterMerge.apk 2>&1 | tee build/export.log
          test -s build/MonsterMerge.apk
          ls -lh build/MonsterMerge.apk

      - name: Upload export logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Monster-Merge-export-logs
          path: |
            build/export.log
            build/import.log
            build/validation.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monster-Merge-Android-APK
          path: build/MonsterMerge.apk
          if-no-files-found: error
          retention-days: 14
